<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F5" />
    <meta name="description" content="HANGAR — Arquitectura, diseño de interiores e inmobiliaria. Planteamos, diseñamos y construimos espacios para habitar." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Cinzel:wght@500;600&family=Manrope:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>HANGAR — Arquitectura · Interiores · Inmobiliaria</title>
    <script>
      // Aplica tema e idioma guardados antes de pintar (evita parpadeo)
      try {
        var p = JSON.parse(localStorage.getItem('hangar-prefs') || '{}').state || {};
        var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        document.documentElement.lang = p.lang || 'es';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
